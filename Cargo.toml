[package]
name = "zen-minecraft-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A headless Minecraft Java 1.16.1 client library for externally controlled agents"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/zen-minecraft-client"
keywords = ["minecraft", "headless", "bot", "client", "protocol"]
categories = ["game-development", "network-programming"]
include = [
    "/src/**",
    "/data/**",
    "/examples/**",
    "/docs/**",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
]

[lib]
name = "zen_minecraft_client"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
byteorder = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
hex = "0.4"
