[package]
name = "voxrig"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A headless Minecraft client with explicit Java version adapters for externally controlled agents"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/voxrig"
keywords = ["minecraft", "headless", "bot", "client", "protocol"]
categories = ["game-development", "network-programming"]
include = [
    "/src/**",
    "/data/**",
    "/examples/**",
    "/docs/**",
    "/scripts/generate_java_1_21_11.cjs",
    "/scripts/prepare_motion_confirmation.py",
    "/scripts/run_common_native.py",
    "/scripts/ExportRecipeDisplays.java",
    "/scripts/ExportCraftingReturns.java",
    "/scripts/export_crafting_returns.py",
    "/scripts/ExportRecipeGhosts.java",
    "/scripts/export_recipe_ghost.py",
    "/scripts/ExportRecipePlacement.java",
    "/scripts/export_recipe_placement.py",
    "/scripts/ExportRecipeGridMatching.java",
    "/scripts/export_recipe_grid_matching.py",
    "/scripts/ExportRecipeBookStock.java",
    "/scripts/ExportRecipeBookMatching.java",
    "/scripts/export_recipe_book_matching.py",
    "/scripts/export_recipe_book_stock.py",
    "/scripts/export_recipe_displays.py",
    "/scripts/test_native_trace.py",
    "/scripts/ExportItemComponentSchema.java",
    "/scripts/export_item_component_schema.py",
    "/scripts/export_outline_shapes.py",
    "/scripts/ExportOutlineShapes.java",
    "/scripts/PrepareOutlineOracle.java",
    "/scripts/VerifyInventoryClick.java",
    "/scripts/VerifySurvivalFoundation.java",
    "/scripts/VerifySurvivalPlacement.java",
    "/scripts/VerifySurvivalMovement.java",
    "/scripts/VerifyPositionCorrection.java",
    "/scripts/VerifyDryMovement.java",
    "/scripts/VerifyLegacyDryMovement.java",
    "/scripts/VerifyLegacyTargeting.java",
    "/scripts/VerifyLegacyInventorySwap.java",
    "/scripts/VerifyContainerClose.java",
    "/scripts/InspectNativeClose.java",
    "/scripts/ExportCursorReturns.java",
    "/scripts/export_cursor_returns.py",
    "/scripts/ExportItemComponents.java",
    "/scripts/ExportNbtSemantics.java",
    "/scripts/export_nbt_semantics.py",
    "/scripts/ExportItemProperties.java",
    "/scripts/ExportItemSemantics.java",
    "/scripts/ExportComponentValueRules.java",
    "/scripts/export_component_value_rules.py",
    "/scripts/ExportComponentNormalization.java",
    "/scripts/ExportResourceIdentifiers.java",
    "/scripts/ExportTextDependencies.java",
    "/scripts/export_text_dependencies.py",
    "/scripts/ExportTextCore.java",
    "/scripts/export_text_core.py",
    "/scripts/ExportCharacterNames.java",
    "/scripts/export_character_names.py",
    "/scripts/ExportSelectors.java",
    "/scripts/export_selectors.py",
    "/scripts/ExportUris.java",
    "/scripts/export_uris.py",
    "/scripts/ExportEnchantmentConstructors.java",
    "/scripts/export_enchantment_constructors.py",
    "/scripts/ExportBookConstructors.java",
    "/scripts/export_book_constructors.py",
    "/scripts/ExportFractionConstructors.java",
    "/scripts/export_fraction_constructors.py",
    "/scripts/ExportNestedItemConstructors.java",
    "/scripts/export_nested_item_constructors.py",
    "/scripts/ExportEffectiveItemComponents.java",
    "/scripts/export_effective_item_components.py",
    "/scripts/ExportRegistryCatalog.java",
    "/scripts/export_registry_catalog.py",
    "/scripts/ExportHolderComparison.java",
    "/scripts/export_holder_comparison.py",
    "/scripts/ExportEntityTooltips.java",
    "/scripts/export_entity_tooltips.py",
    "/scripts/ExportClickConstructors.java",
    "/scripts/export_click_constructors.py",
    "/scripts/ExportProfiles.java",
    "/scripts/export_profiles.py",
    "/scripts/ExportTextConstructors.java",
    "/scripts/export_text_constructors.py",
    "/scripts/export_component_normalization.py",
    "/scripts/RecordingNativeHashOps.java",
    "/scripts/export_item_semantics.py",
    "/scripts/export_item_properties.py",
    "/scripts/export_item_components.py",
    "/scripts/ExportMenuLayouts.java",
    "/scripts/ExportStorageOutlines.java",
    "/scripts/ExportRegularClicks.java",
    "/scripts/export_regular_clicks.py",
    "/scripts/ExportInventoryTransfers.java",
    "/scripts/export_inventory_transfers.py",
    "/scripts/ExportEquipmentTransfers.java",
    "/scripts/export_equipment_transfers.py",
    "/scripts/ExportHeldCursorTransfers.java",
    "/scripts/export_held_cursor_transfers.py",
    "/scripts/ExportArmorTransfers.java",
    "/scripts/export_armor_transfers.py",
    "/scripts/ExportCraftingMenus.java",
    "/scripts/export_crafting_menus.py",
    "/scripts/ExportCraftingOutlines.java",
    "/scripts/export_crafting_outlines.py",
    "/scripts/ExportVehicleInput.java",
    "/scripts/ExportVehicleControl.java",
    "/scripts/export_vehicle_control.py",
    "/scripts/export_vehicle_input.py",
    "/scripts/ExportDryTerrain.java",
    "/scripts/ExportMiningTools.java",
    "/scripts/export_mining_tools.py",
    "/scripts/export_dry_terrain.py",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
]

[lib]
name = "voxrig"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
byteorder = "1"
flate2 = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
hex = "0.4"
