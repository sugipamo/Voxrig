[lib]
name = "voxrig"
path = "src/lib.rs"

[features]
# Version-specific APIs outside the common `Client` (`Client::native`,
# `voxrig::versions::java_1_16_1`, `voxrig::versions::java_1_21_11`).
# See docs/native-feature.md.
native = []

[dependencies]
anyhow = "1"
byteorder = "1"
flate2 = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
hex = "0.4"

