[package]
name = "voxrig"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A headless Minecraft client with explicit Java version adapters for externally controlled agents"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/voxrig"
keywords = ["minecraft", "headless", "bot", "client", "protocol"]
categories = ["game-development", "network-programming"]
