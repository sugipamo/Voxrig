[package]
name = "voxrig"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A headless Minecraft client with explicit Java version adapters for externally controlled agents"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/voxrig"
keywords = ["minecraft", "headless", "bot", "client", "protocol"]
categories = ["game-development", "network-programming"]
include = [
    "/src/**",
    "/data/**",
    "/examples/**",
    "/docs/**",
    "/scripts/generate_java_1_21_11.cjs",
    "/scripts/prepare_motion_confirmation.py",
    "/scripts/run_common_native.py",
    "/scripts/test_native_trace.py",
    "/scripts/ExportItemComponentSchema.java",
    "/scripts/export_item_component_schema.py",
    "/scripts/export_outline_shapes.py",
    "/scripts/ExportOutlineShapes.java",
    "/scripts/PrepareOutlineOracle.java",
    "/scripts/VerifyInventoryClick.java",
    "/scripts/VerifySurvivalFoundation.java",
    "/scripts/VerifySurvivalPlacement.java",
    "/scripts/VerifySurvivalMovement.java",
    "/scripts/VerifyPositionCorrection.java",
    "/scripts/VerifyDryMovement.java",
    "/scripts/VerifyLegacyDryMovement.java",
    "/scripts/VerifyLegacyTargeting.java",
    "/scripts/VerifyLegacyInventorySwap.java",
    "/scripts/VerifyContainerClose.java",
    "/scripts/InspectNativeClose.java",
    "/scripts/ExportCursorReturns.java",
    "/scripts/export_cursor_returns.py",
    "/scripts/ExportItemComponents.java",
    "/scripts/ExportNbtSemantics.java",
    "/scripts/export_nbt_semantics.py",
    "/scripts/ExportItemProperties.java",
    "/scripts/ExportItemSemantics.java",
    "/scripts/ExportComponentValueRules.java",
    "/scripts/export_component_value_rules.py",
    "/scripts/ExportComponentNormalization.java",
    "/scripts/ExportResourceIdentifiers.java",
    "/scripts/ExportTextCore.java",
    "/scripts/export_text_core.py",
    "/scripts/ExportCharacterNames.java",
    "/scripts/export_character_names.py",
    "/scripts/ExportSelectors.java",
    "/scripts/export_selectors.py",
    "/scripts/ExportProfiles.java",
    "/scripts/export_profiles.py",
    "/scripts/ExportTextConstructors.java",
    "/scripts/export_text_constructors.py",
    "/scripts/export_component_normalization.py",
    "/scripts/RecordingNativeHashOps.java",
    "/scripts/export_item_semantics.py",
    "/scripts/export_item_properties.py",
    "/scripts/export_item_components.py",
    "/scripts/ExportMenuLayouts.java",
    "/scripts/ExportStorageOutlines.java",
    "/scripts/ExportRegularClicks.java",
    "/scripts/export_regular_clicks.py",
    "/scripts/ExportInventoryTransfers.java",
    "/scripts/export_inventory_transfers.py",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
]

[lib]
name = "voxrig"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
byteorder = "1"
flate2 = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
hex = "0.4"
